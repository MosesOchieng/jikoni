kind = "web"
previewPath = "/"
title = "Mama Mboga"
description = "A friendly grocery ordering web app for browsing fresh produce, building a cart, and completing local deliveries."
version = "1.0.0"
id = "artifacts/mama-mboga"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21517

[services.development]
run = "pnpm --filter @workspace/mama-mboga run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mama-mboga", "run", "build" ]
serve = "static"
publicDir = "artifacts/mama-mboga/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21517"
BASE_PATH = "/"
